# XAI 대안신용평가 - docker-compose (1주차 초안: app + mlflow)
# 9주차에 api(FastAPI) / dashboard(Streamlit) 서비스를 아래 주석 자리에 추가한다.
#
# 사용법
#   docker compose up -d mlflow                          # MLflow 서버 켜기 -> http://localhost:5000
#   docker compose run --rm app python run_data_pipeline.py
#   docker compose run --rm app python -m src.models.train
#   docker compose down                                  # 끄기 (기록은 mlflow-data 볼륨에 남음)

services:
  # 실험 추적 서버: 실행 기록(DB)과 모델 파일(artifact)을 모두 이 서버가 저장한다.
  # 클라이언트는 http로만 보내므로 팀원 PC마다 mlruns/ 경로가 달라도 문제없다.
  mlflow:
    build: .
    image: xai-credit:dev
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "mlflow,mlflow:5000,localhost,localhost:*,127.0.0.1,127.0.0.1:*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # 개발용 컨테이너: 전처리, 학습, 노트북 스크립트 실행
  app:
    build: .
    image: xai-credit:dev
    env_file:
      - path: .env
        required: false
    environment:
      # .env 값보다 우선한다 -> compose 안에서는 항상 mlflow 서버로 기록
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      # 코드를 통째로 연결 -> 로컬에서 고친 코드가 바로 반영되고,
      # data/processed, models/ 결과물도 로컬 폴더에 그대로 생긴다
      - .:/app
    depends_on:
      mlflow:
        condition: service_healthy
    stdin_open: true
    tty: true

  # ── 9주차 추가 예정 ──
  # api:
  #   build: .
  #   image: xai-credit:dev
  #   command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
  #   ports: ["8000:8000"]
  #   environment:
  #     MLFLOW_TRACKING_URI: http://mlflow:5000
  #   volumes: [".:/app"]
  #   depends_on: [mlflow]
  #
  # dashboard:
  #   build: .
  #   image: xai-credit:dev
  #   command: streamlit run src/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
  #   ports: ["8501:8501"]
  #   environment:
  #     API_URL: http://api:8000
  #   volumes: [".:/app"]
  #   depends_on: [api]

volumes:
  mlflow-data:
