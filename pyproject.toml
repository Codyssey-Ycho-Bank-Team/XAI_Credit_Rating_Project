[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "xai-credit-rating"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.6",
    "kagglehub==1.0.2",
    "python-dotenv==1.2.3",
    "scikit-learn==1.9.1",
    "joblib==1.6.0",
    "numpy==2.5.3",
    "scipy==1.18.1",
    "pyarrow==25.0.1",
]

[project.optional-dependencies]
dev = [
    "jupyter==1.1.1",
    "matplotlib==3.11.2",
]

[tool.setuptools.packages.find]
include = ["src*"]